
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KeyForge | Account</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b1020;color:white;
 font-family:Arial,sans-serif;
 display:flex;justify-content:center;align-items:center;
 min-height:100vh;padding:20px
}
.card{
 width:100%;max-width:420px;background:#151e34;
 padding:30px;border-radius:16px;
 border:1px solid #283652
}
h1{color:#65e6ad;text-align:center}
p{text-align:center;color:#aab4cc}
input{
 width:100%;padding:14px;margin:10px 0;
 background:#0b1020;border:1px solid #34415c;
 color:white;border-radius:8px
}
button{
 width:100%;padding:14px;margin-top:12px;
 background:#65e6ad;border:0;border-radius:8px;
 font-weight:bold;cursor:pointer
}
.switch{background:transparent;color:#65e6ad}
#message{font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
<h1>⚡ KeyForge API</h1>
<p>Create your account or sign in</p>

<input id="email" type="email" placeholder="Email address">
<div style="position:relative">
  <input
    id="password"
    type="password"
    placeholder="Password"
    style="padding-right:65px"
  >

  <button
    type="button"
    id="togglePassword"
    style="position:absolute;right:8px;top:10px;width:auto;
    margin:0;padding:12px;background:transparent;
    color:#65e6ad;border:0"
  >👁️</button>
</div>
<button id="signup">Create Account</button>
<button id="login">Login</button>

<p id="message"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
const email = document.getElementById("email");
const password = document.getElementById("password");
const message = document.getElementById("message");

document.getElementById("signup").onclick = async () => {
 if(!email.value || !password.value){
  message.textContent="Enter your email and password.";
  return;
 }

 if(password.value.length < 8){
  message.textContent="Password must be at least 8 characters.";
  return;
 }

 message.textContent="Creating your account...";

 const {data,error} = await supabaseClient.auth.signUp({
  email:email.value.trim(),
  password:password.value
 });

 if(error){
  message.textContent=error.message;
 }else if(data.session){
  message.textContent="Account created successfully!";
 }else{
  message.textContent="Account created! Check your email to verify your account.";
 }
};

document.getElementById("login").onclick = async () => {
 if(!email.value || !password.value){
  message.textContent="Enter your email and password.";
  return;
 }

 message.textContent="Signing in...";

 const {data,error} = await supabaseClient.auth.signInWithPassword({
  email:email.value.trim(),
  password:password.value
 });

 if(error){
  message.textContent=error.message;
 }else{
  message.textContent="Login successful! Welcome to KeyForge.";
 }
};
 document.getElementById("togglePassword").onclick = () => {
  const password = document.getElementById("password");
  const button = document.getElementById("togglePassword");

  if (password.type === "password") {
    password.type = "text";
    button.textContent = "🙈";
  } else {
    password.type = "password";
    button.textContent = "👁️";
  }
};
</script>
</body>
</html>
